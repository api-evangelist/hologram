description: >-
  FinOps view of Hologram connectivity spend. Hologram bills usage-based per-MB
  data charges, a flat monthly recurring charge per active SIM, a one-time
  per-SIM card cost, and per-message outbound SMS charges. Custom plans apply
  discounted volume rates, data pools, and zero fees for inactive SIMs.
notes: >-
  Rates are subject to change and Custom plan rates are negotiated; verify
  against the Hologram pricing page during reconciliation.
sources:
- https://www.hologram.io/pricing/
- https://docs.hologram.io/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
