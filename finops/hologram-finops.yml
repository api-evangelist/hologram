serviceCategory: IoT and Connectivity
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Hologram Connectivity
  ServiceCategory: IoT and Connectivity
  ProviderName: Hologram
  PublisherName: Hologram
  InvoiceIssuerName: Hologram
