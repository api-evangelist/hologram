meters:
- name: data_megabytes
  description: Cellular data consumed by devices, billed per MB.
  unit: megabytes
  aggregation: sum
  dimensions:
  - account
  - organization
  - link
  - zone
- name: sim_monthly_active
  description: Active SIMs billed a flat monthly recurring charge.
  unit: sims
  aggregation: count
  dimensions:
  - account
  - organization
- name: sim_card_purchase
  description: One-time per-SIM card cost at purchase.
  unit: sims
  aggregation: count
  dimensions:
  - account
  - organization
- name: sms_outbound
  description: Outbound SMS messages sent to devices, billed per message (inbound free).
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - organization
  - link
principles:
- name: Visibility
  description: Pull data and SMS usage via /usage/data and /usage/sms; inspect per-SIM and per-tag consumption.
- name: Allocation
  description: Group SIMs with device tags and per-organization scoping to map spend to teams or deployments.
- name: Optimization
  description: Set overage and data thresholds per SIM, pause idle SIMs, and use Custom plan data pools and inactive-SIM fee waivers for large fleets.
- name: Accountability
  description: Assign organization owners and review monthly per-SIM data and SMS spend against budget.
maintainers:
