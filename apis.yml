name: Hologram
kind: company
description: Hologram is a global cellular IoT connectivity platform providing eUICC
  SIMs that roam across 550+ carrier networks in 200+ countries. The Hologram REST
  API lets developers activate and manage SIMs and devices, query data and SMS usage,
  send SMS and cloud messages to devices, manage plans and tags, and open secure
  Spacebridge tunnels.
